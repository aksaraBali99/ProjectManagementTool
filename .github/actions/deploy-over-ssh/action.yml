# task #119: the deploy steps shared by deploy-dev and deploy-prod
# (deploy.yml). Checks the environment's config, sets up SSH, runs the
# commit's own deploy.sh on the server, then smoke-tests /up.
#
# The SSH key is written to $RUNNER_TEMP/deploy_key. The calling job
# removes it in an `if: always()` step, so it goes even when this fails.
#
# SOL-0023: with ssh-gate 'true', the action uses ssh-gate-key, a key
# the server only lets run its deploy gate (server/solava-gate.sh), and
# sends just "deploy <sha>". With 'false' it uses ssh-key and sends the
# same shell line as before the gate (the rollback path).

name: Deploy over SSH
description: Runs deploy.sh on the environment's server for one commit, then smoke-tests it.

inputs:
  environment:
    description: The GitHub environment's name (dev or production), for the summary
    required: true
  branch:
    description: main or production
    required: true
  sha:
    description: The commit to deploy
    required: true
  dry-run:
    description: "'true' to only print what would be deployed"
    required: false
    default: 'false'
  deploy-args:
    description: Extra deploy.sh flags (--maintenance --backup). Ignored with ssh-gate, where the server's gate adds them.
    required: false
    default: ''
  ssh-gate:
    description: "'true' to deploy through the server's SSH deploy gate with ssh-gate-key"
    required: false
    default: 'false'
  ssh-key:
    description: The unrestricted deploy key, used when ssh-gate isn't 'true'
    required: false
    default: ''
  ssh-gate-key:
    description: The gate-only deploy key, used when ssh-gate is 'true'
    required: false
    default: ''
  ssh-known-hosts:
    required: true

outputs:
  result:
    description: deployed, skipped (a newer commit is on the branch) or dry-run
    value: ${{ steps.deploy.outputs.result }}

runs:
  using: composite
  steps:
    - name: Check the environment's config
      shell: bash
      env:
        SSH_GATE: ${{ inputs.ssh-gate }}
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_GATE_KEY: ${{ inputs.ssh-gate-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      # Every variable and secret set (the gate key when the gate is on),
      # and APP_PATH a full path. Tested by tests/scripts/run.sh.
      run: bash "$GITHUB_WORKSPACE/.github/scripts/check-deploy-config.sh"

    - name: Set up SSH
      shell: bash
      env:
        SSH_GATE: ${{ inputs.ssh-gate }}
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_GATE_KEY: ${{ inputs.ssh-gate-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      run: |
        # The key is picked here, not in deploy.yml: there, a missing
        # SSH_GATE_KEY would quietly fall back to the unrestricted key.
        key="$SSH_KEY"
        if [[ "$SSH_GATE" == "true" ]]; then key="$SSH_GATE_KEY"; fi
        install -m 700 -d ~/.ssh
        (umask 077 && printf '%s\n' "$key" > "$RUNNER_TEMP/deploy_key")
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Run deploy.sh on the server
      id: deploy
      shell: bash
      env:
        SSH_GATE: ${{ inputs.ssh-gate }}
        BRANCH: ${{ inputs.branch }}
        SHA: ${{ inputs.sha }}
        DRY_RUN: ${{ inputs.dry-run }}
        DEPLOY_ARGS: ${{ inputs.deploy-args }}
      run: |
        # "deploy <sha>" for the gate, else the whole shell line that runs
        # the commit's own deploy.sh. Tested by tests/scripts/run.sh.
        remote=$(bash "$GITHUB_WORKSPACE/.github/scripts/deploy-remote-command.sh")

        set +e
        ssh -n -T -p "$SSH_PORT" -i "$RUNNER_TEMP/deploy_key" \
          -o IdentitiesOnly=yes -o BatchMode=yes \
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
          -o ConnectTimeout=30 -o ServerAliveInterval=30 \
          "$SSH_USER@$SSH_HOST" "$remote"
        code=$?
        set -e

        if ((code == 78)); then
          echo "::notice::Skipped: a newer commit is on $BRANCH, and its own run deploys it."
          echo "result=skipped" >> "$GITHUB_OUTPUT"
        elif ((code == 126)) && [[ "$SSH_GATE" == "true" ]]; then
          echo "::error::The server's SSH deploy gate refused the command (exit 126). Nothing was deployed. Check that gate.sh is installed in ~/apps/solava/bin, that this key's line in authorized_keys runs it for the right environment, and gate.log next to it (docs/release-process.md, SSH deploy gate)."
          exit "$code"
        elif ((code == 127)) && [[ "$SSH_GATE" == "true" ]]; then
          echo "::error::The server tried to run 'deploy' as a shell command (exit 127): this key's line in authorized_keys has no gate. SSH_GATE is on for a key without the gate. Fix the key line, or set SSH_GATE to false (docs/release-process.md, SSH deploy gate)."
          exit "$code"
        elif ((code == 75)) && [[ "$SSH_GATE" == "true" ]]; then
          echo "::error::Another deploy is running on this server (the gate's lock is held). Nothing was deployed. Re-run once it's done."
          exit "$code"
        elif ((code != 0)); then
          echo "::error::deploy.sh failed (exit $code). The log above says which step and how to recover; if maintenance mode was on, the site is still down."
          exit "$code"
        elif [[ "$DRY_RUN" == "true" ]]; then
          echo "result=dry-run" >> "$GITHUB_OUTPUT"
        else
          echo "result=deployed" >> "$GITHUB_OUTPUT"
        fi

    - name: Smoke test /up
      id: smoke
      if: steps.deploy.outputs.result == 'deployed'
      shell: bash
      run: |
        url="${APP_URL%/}/up"
        for try in 1 2 3 4 5; do
          if curl -fsS --max-time 20 -o /dev/null "$url"; then
            echo "Smoke test passed on try $try: $url"
            echo "result=passed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ((try < 5)); then sleep 10; fi
        done
        echo "result=failed" >> "$GITHUB_OUTPUT"
        echo "::error::$url didn't answer 200 after 5 tries. The deploy ran; check the site and storage/logs/laravel.log on the server."
        exit 1

    - name: Job summary
      if: always()
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        GATE: ${{ inputs.ssh-gate == 'true' && 'on' || 'off' }}
        BRANCH: ${{ inputs.branch }}
        SHA: ${{ inputs.sha }}
        RESULT: ${{ steps.deploy.outputs.result || 'failed' }}
        SMOKE: ${{ steps.smoke.outputs.result || 'not run' }}
      run: |
        {
          echo "### Deploy to $ENVIRONMENT"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| APP_ENV | ${EXPECTED_APP_ENV:-not set} |"
          echo "| SSH gate | $GATE |"
          echo "| Branch | \`$BRANCH\` |"
          echo "| Commit | \`$SHA\` |"
          echo "| Result | $RESULT |"
          echo "| Smoke test (/up) | $SMOKE |"
        } >> "$GITHUB_STEP_SUMMARY"
