name: CI

# task #119: PRs into main or production run this directly (the required
# "test" check). Pushes don't: the Deploy workflow calls it first
# (workflow_call), so a merge runs CI once, then deploys.
on:
  pull_request:
    branches: [main, production]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, dom, fileinfo, gd, intl, mysqli, pdo_mysql, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Generate application key
        run: php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

      - name: Check shell scripts (shellcheck)
        run: shellcheck deploy.sh .github/scripts/*.sh tests/scripts/*.sh

      - name: Test release scripts
        run: bash tests/scripts/run.sh
